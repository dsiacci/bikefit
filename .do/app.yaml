# DigitalOcean App Platform: the page as a static site, rebuilt on every push to main.
# The build copies the MediaPipe runtime from the pinned npm package and downloads
# the models after a checksum (tools/build.mjs). Static sites cannot set response
# headers on App Platform; the page carries its Content-Security-Policy in a meta tag.
name: bikefit
static_sites:
  - name: web
    github:
      repo: dsiacci/bikefit
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    build_command: npm ci && npm run build
    output_dir: web
    index_document: index.html
    error_document: 404.html
ingress:
  rules:
    - component:
        name: web
      match:
        path:
          prefix: /
